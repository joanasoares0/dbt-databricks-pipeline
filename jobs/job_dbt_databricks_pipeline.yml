resources:
  jobs:
    job_dbt_databricks_pipeline:
      name: job_dbt_databricks_pipeline
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 4
          unit: WEEKS
      tasks:
        - task_key: load_raw
          notebook_task:
            notebook_path: scripts/load_raw.py
            source: GIT
          environment_key: Default
        - task_key: dbt_build
          depends_on:
            - task_key: load_raw
          dbt_task:
            project_directory: analytics
            commands:
              - dbt deps
              - dbt debug
              - dbt build
            schema: default
            # filled in at deploy time from BUNDLE_VAR_warehouse_id (kept in .env)
            warehouse_id: ${var.warehouse_id}
            catalog: prod
            source: GIT
          environment_key: dbt-default
      git_source:
        git_url: https://github.com/joanasoares0/dbt-databricks-pipeline
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
        - environment_key: dbt-default
          spec:
            dependencies:
              - dbt-databricks>=1.0.0,<2.0.0
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
