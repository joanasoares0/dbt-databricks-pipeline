# Raw data lives in raw.jobs. The schema is named after the system the data.
# scripts/load_raw.py loads these tables. dbt only reads them, it never writes to them.

sources:
  - name: jobs
    description: >
      The landing zone: raw job-market data landed by the ingestion notebook
      (scripts/load_raw.py). One owner — dbt only reads it.
      
    database: raw        # the catalog created by the load notebook
    schema: jobs

    tables:
      - name: raw_job_postings
        description: >
          One row per posting per scrape event, exactly as scraped — error rows,
          text salaries, relative dates and all. Cleaning it is the pipeline's job.

      - name: raw_job_skills
        description: >
          One row per (job_id, skill_keyword) extracted from the postings. A skill_id
          repeats on a job when the posting names it two ways (spark, pyspark).
