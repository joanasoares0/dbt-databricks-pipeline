# Keeps the full history of each job posting (a "type 2" snapshot).
# Postings change over time: for example, 2,756 jobs change their salary text
# between scrapes. Each change becomes a new version row.
#
# - check_cols lists only the posting's content. Scrape details like
#   searched_at or search_* change on every scrape, so tracking them would
#   create a new version every time.

# - updated_at uses searched_at, so dbt_valid_from / dbt_valid_to show when
#   the data changed, not when dbt happened to run.

# - Choosing the current row for each job happens in the input model
#   stg_job_postings_current.

snapshots:
  - name: job_postings_snapshot
    description: >
      SCD2 history of posting content: one row per (job_id, version), with
      dbt_valid_from/to carrying data time via updated_at. New version only
      when a check_cols column changes; current row has dbt_valid_to null.
      Queried by analyses/top_posting_editors.sql and analyses/salary_swings.sql.
    relation: ref('stg_job_postings_current') # a source or an ephemeral model
    config:
      schema: snapshots
      unique_key: job_id
      strategy: check
      check_cols:
        - job_title
        - company_name
        - job_location
        - job_schedule_type
        - job_work_from_home
        - salary_min
        - salary_max
        - salary_period
        - salary_currency
        - has_health_insurance
        - has_dental_insurance
        - has_paid_time_off
        - has_no_degree_mentioned
      updated_at: searched_at