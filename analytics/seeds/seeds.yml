# Optional: nothing needs this file to run. It only adds descriptions
# to the docs site built by `dbt docs generate`.
# There are no tests here on purpose: dim_skill already tests skill_id
# (unique and not null), so testing it again here would be redundant.

seeds:
  - name: skill_categories
    description: >
      Hand-maintained mapping of every skill_id to a display name and
      category/subcategory rollup. The spine of dim_skill: a LEFT JOIN from
      here guarantees every cataloged skill gets a row, observed in postings
      or not. Loaded with dbt seed; students fetch the CSV from
      lukeb.co/skill-categories.
    columns:
      - name: skill_id
        description: Skill key; joins stg_job_skills and anchors dim_skill's PK.
      - name: display_name
        description: Human-readable skill name ('PostgreSQL', not 'postgresql').
      - name: category
        description: Top-level rollup (Programming, Cloud, Applications, ...).
      - name: subcategory
        description: Finer rollup within the category.