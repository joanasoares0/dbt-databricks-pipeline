# Optional: nothing needs this file to run.
# dbt compiles analyses but never builds or tests them, so this file only
# adds their descriptions to the docs site built by `dbt docs generate`.

analyses:
  - name: jinja_practice
    description: >
      The Jinja scratchpad: compiled by dbt, never built. Where the slugify
      macro got tested before it touched a real model.

  - name: in_demand_skills
    description: >
      Skill demand across the whole star (fct ⋈ bridge ⋈ dim_skill): distinct
      postings per skill. All roles by default; scope to one with
      --vars 'job_title: Data Analyst'.

  - name: top_skills_by_salary
    description: >
      Highest-paying skills: average annual salary per skill, filtered to
      comparable pay (USD + yearly) on the fct unit columns.

  - name: optimal_skills
    description: >
      Skills that are both in demand AND well paid, in one ranking; a
      100-posting demand floor keeps one-posting salary outliers out.

  - name: top_posting_editors
    description: >
      Which companies edit their postings the most — counts each company's
      jobs with a closed snapshot version (dbt_valid_to IS NOT NULL).

  - name: salary_swings
    description: >
      Biggest salary swings per posting, from the snapshot: MIN/MAX across a
      job's versions, USD only. The top of the board is typos caught mid-edit.