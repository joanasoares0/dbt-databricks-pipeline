name: analytics

profile: databricks

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  analytics:
    +schema: raw

models:
  analytics:
  
    +persist_docs:
      relation: true 
      columns: true 

    +static_analysis: strict

    # Materialize staging models as views, and marts as tables
    1_staging:
      +materialized: view
      +schema: staging
    2_intermediate:
      +materialized: view
      +schema: intermediate
    3_marts:
      +materialized: table
      +schema: marts